server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The build already emits a hash-locked CSP <meta>. These are the headers a
    # <meta> cannot carry — frame-ancestors in particular is ignored there.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The vault lives in localStorage; keep it off any cached intermediary.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
